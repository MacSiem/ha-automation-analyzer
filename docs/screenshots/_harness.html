<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AA screenshot harness</title>
<style>
  html, body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body.light { background: #f4f5f7; }
  body.light ha-automation-analyzer { --card-background-color: #ffffff; --primary-background-color: #f4f5f7; }
  body.dark { background: #111318; }
  body.dark ha-automation-analyzer { --card-background-color: #1c1e26; --primary-background-color: #111318; }
  ha-automation-analyzer { display: block; width: 480px; }
</style>
</head>
<body>
<ha-automation-analyzer id="card"></ha-automation-analyzer>
<script>
  try { localStorage.setItem('ha-intro-dismissed-ha-automation-analyzer', '1'); } catch (e) {}
</script>
<script src="../../ha-automation-analyzer.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.className = theme;
  const now = Date.now(); const h = 3600000;

  const mk = (id, name, state, last, cur) => ({
    entity_id: 'automation.' + id, state,
    attributes: { friendly_name: name, last_triggered: last ? new Date(now - last).toISOString() : null, current: cur || 0, mode: 'single', id: id },
    last_changed: new Date(now - 2 * h).toISOString(), last_updated: new Date(now - 2 * h).toISOString(),
  });
  const autos = [
    mk('morning_lights', 'Morning lights on sunrise', 'on', 3 * h),
    mk('night_thermostat', 'Night thermostat setback', 'on', 9 * h),
    mk('door_notify', 'Front door open notification', 'on', 0.4 * h),
    mk('vacation_presence', 'Vacation presence simulation', 'off', null),
    mk('water_leak_alert', 'Water leak alert', 'on', 26 * h),
    mk('garage_autoclose', 'Garage auto-close at night', 'on', 14 * h),
    mk('media_movie_scene', 'Movie scene on media play', 'on', 50 * h),
    mk('battery_report', 'Weekly low-battery report', 'on', 120 * h),
  ];
  const states = {};
  autos.forEach(a => { states[a.entity_id] = a; });

  const hass = {
    language: 'en',
    themes: { darkMode: theme === 'dark' },
    states,
    services: {},
    connection: { subscribeEvents: () => Promise.resolve(() => {}) },
    callWS: async (msg) => {
      const t = String(msg && msg.type || '');
      if (t === 'config/automation/list') {
        return autos.map(a => ({ id: a.attributes.id, alias: a.attributes.friendly_name, mode: 'single' }));
      }
      if (t.includes('trace/list')) {
        const itemId = msg.item_id || msg.automation_id;
        const pool = itemId ? autos.filter(a => a.attributes.id === itemId) : autos;
        const runs = [];
        pool.forEach((a, ai) => {
          const n = [3, 5, 2, 0, 4, 1, 2, 1][ai % 8];
          for (let i = 0; i < n; i++) {
            const start = now - (i + 1) * 2.1 * h - ai * 600000;
            const dur = [45, 180, 920, 60, 1400][(ai + i) % 5];
            runs.push({
              run_id: a.attributes.id + '-' + i,
              item_id: a.attributes.id,
              state: 'stopped',
              script_execution: 'finished',
              timestamp: { start: new Date(start).toISOString(), finish: new Date(start + dur).toISOString() },
              last_step: 'action/0',
            });
          }
        });
        return runs;
      }
      return {};
    },
    callApi: async () => ({}),
    callService: async () => ({}),
  };

  const card = document.getElementById('card');
  card.setConfig({ type: 'custom:ha-automation-analyzer', title: 'Automation Analyzer' });
  card.hass = hass;
  setTimeout(() => { card.hass = { ...hass }; }, 400);
  const scrub = () => { try { card.shadowRoot && card.shadowRoot.querySelectorAll('#tip-banner, [class*="banner"], .donate-section').forEach(n => n.remove()); } catch (e) {} };
  setInterval(scrub, 150);
  setTimeout(() => { scrub(); document.title = 'AA-READY'; }, 1300);
})();
</script>
</body>
</html>
